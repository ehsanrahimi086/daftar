name: APK سرپرست کارگاه

on:
  push:
    branches: [main]
    paths: ["sarparast/**", "android-sv/**", ".github/workflows/sarparast-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Capacitor project
        working-directory: android-sv
        run: |
          npm install --no-audit --no-fund
          rm -rf www android && cp -r ../sarparast www
          npx cap add android
          npx cap sync android
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp res/mipmap-$d/*.png android/app/src/main/res/mipmap-$d/; done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build
        working-directory: android-sv/android
        env:
          KS_B64: ${{ secrets.SV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then ./gradlew assembleRelease --no-daemon -q; else ./gradlew assembleDebug --no-daemon -q; fi

      # With the repository secrets SV_KEYSTORE_B64 (base64 of the .jks) and SV_KEYSTORE_PASS every build is signed
      # with the same key, so a new version installs over the old one. Without them the APK is debug-signed.
      - name: Sign
        working-directory: android-sv
        env:
          KS_B64: ${{ secrets.SV_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SV_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > ks.jks
            $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks ks.jks --ks-pass env:KS_PASS --out sarparast.apk aligned.apk
            rm -f ks.jks
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk sarparast.apk
          fi
          ls -l sarparast.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sarparast-v${{ github.run_number }}
          name: سرپرست کارگاه — نسخهٔ ${{ github.run_number }}
          body: برنامهٔ اندروید سرپرست کارگاه. فایل sarparast.apk را روی گوشی باز و نصب کنید.
          files: android-sv/sarparast.apk
          make_latest: true
