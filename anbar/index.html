<style>
@font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("../fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 800; font-display: swap; }

/* Layout: same header as the other books, a four-way switch (record / stock / contractors / history).
   Two warehouses: the central one (shared by all projects) and one on site per project.
   Every record is one "document" with several lines; stock is always worked out from the documents. */
:root { --ink: #EDF0F7; --muted: #8F9AB2; --line: rgba(255,255,255,.09); --accent: #CFAE6A; --r: 16px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: "Vazirmatn", Tahoma, system-ui, sans-serif; font-size: 15px; line-height: 1.7; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { max-width: 620px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }

.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
.hub-back { display: flex; align-items: center; gap: 5px; width: max-content; margin: 0 0 2px; font-size: 12px; font-weight: 500; text-decoration: none; }
.hub-back svg { width: 14px; height: 14px; }
.brand { font-size: 12px; color: var(--muted); font-weight: 500; }
.sa-proj { display: inline-flex; align-items: center; gap: 6px; font-size: 21px; font-weight: 800; color: var(--ink); text-decoration: none; line-height: 1.5; }
.sa-proj::after { content: "تغییر"; font-size: 11px; font-weight: 500; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 0 8px; line-height: 1.7; }
.sa-date { font-size: 13px; color: var(--muted); font-weight: 500; padding-bottom: 6px; }

.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.03); margin: 14px 0; }
.seg.in { margin: 0 0 12px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 10px; padding: 9px 4px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, #E9D29B, #CFAE6A 55%, #A8873F); color: #17110A; font-weight: 700; }

.card { border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.card h2 { margin: 0 0 10px; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 small { font-size: 12px; color: var(--muted); font-weight: 500; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
.fld:first-child, .fld.first { margin-top: 0; }
.fld label, .lbl { font-size: 13px; color: var(--muted); }
.field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 16px; outline: none; min-width: 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.8; }
.err { color: #F2877C; font-size: 13px; margin-top: 8px; }

.btn { min-height: 46px; border-radius: 14px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); padding: 8px 14px; font-size: 14px; font-weight: 500; }
.btn.primary { font-weight: 700; }
.btn.full { width: 100%; font-size: 16px; min-height: 52px; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 13px; border-radius: 10px; }
.btn.danger { color: #F2877C; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.row .btn { flex: 1 1 140px; }

/* item lines of a document */
.irow { display: grid; grid-template-columns: 1fr 1fr 1.25fr 42px; gap: 8px; padding: 10px 0; border-top: 1px dashed var(--line); }
.irow:first-of-type { border-top: 0; padding-top: 0; }
.irow .nm { grid-column: 1 / -1; }
.irow .field { padding-inline: 10px; font-size: 15px; }
.irow select.ct[disabled] { opacity: .75; }
.tbl .grp td { padding: 5px 8px; line-height: 1.5; }
.grp td { background: rgba(207,174,106,.10); color: var(--accent); font-weight: 700; font-size: 13px; padding: 6px 8px; }
.grp small { color: var(--muted); font-weight: 500; }
.irow .x { border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.04); color: #F2877C; font-size: 20px; line-height: 1; }
.irow .un[readonly] { opacity: .75; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: start; font-size: 12px; font-weight: 500; color: var(--muted); padding: 6px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .n { text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl .neg { color: #F2877C; }
.tbl .zero { color: var(--muted); }
.tbl .tot { font-weight: 800; }
.tbl button.nmb { border: 0; background: none; padding: 0; text-align: start; font-weight: 500; }
.tbl small { color: var(--muted); font-weight: 400; }
.scroll { overflow-x: auto; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; font-size: 12.5px; background: none; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(207,174,106,.12); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 0 9px; border-radius: 99px; line-height: 1.8; }
.tag.in { background: rgba(99,207,161,.14); color: #63CFA1; }
.tag.out { background: rgba(240,167,102,.15); color: #F0A766; }
.tag.mv { background: rgba(120,150,230,.16); color: #9DB4F0; }
.doc { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px; }
.doc .t { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.doc .who { font-weight: 700; margin-top: 4px; }
.doc .ln { font-size: 13.5px; color: #C3CADA; margin-top: 2px; }
.doc .bt { display: flex; gap: 8px; margin-top: 10px; }
.doc .bt .btn { flex: 1; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); font-size: 14px; }

.scrim { position: fixed; inset: 0; background: rgba(3,6,14,.65); z-index: 20; }
.sheet { position: fixed; inset-inline: 0; bottom: 0; z-index: 21; max-height: 92vh; overflow: auto; margin: 0 auto; max-width: 620px; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: #0F1729; border: 1px solid rgba(255,255,255,.16); border-bottom: 0; border-radius: 24px 24px 0 0; }
.grip { width: 40px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.16); margin: 0 auto 12px; }
.sheet h2 { margin: 0 0 8px; font-size: 18px; }
.shot { width: 100%; border-radius: 12px; display: block; background: #fff; }
.toast { position: fixed; inset-inline: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px; background: linear-gradient(180deg, #E9D29B, #CFAE6A); color: #17110A; font-weight: 700; border-radius: 14px; padding: 11px 14px; font-size: 14px; text-align: center; z-index: 40; }
</style>

<body>
<div class="app" id="app">
  <header class="top">
    <div>
      <a class="hub-back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>همه دفترها</a>
      <div class="brand">دفتر انبار · پروژه</div>
      <a class="sa-proj" id="saProj" href="../" aria-label="تغییر پروژه در صفحهٔ اصلی"></a>
    </div>
    <div class="sa-date" id="saDate"></div>
  </header>

  <nav class="seg" id="tabs" aria-label="بخش‌ها">
    <button type="button" data-tab="new" aria-pressed="true">ثبت</button>
    <button type="button" data-tab="stock" aria-pressed="false">موجودی</button>
    <button type="button" data-tab="cons" aria-pressed="false">پیمانکار</button>
    <button type="button" data-tab="hist" aria-pressed="false">تاریخچه</button>
  </nav>

  <section id="vNew"></section>
  <section id="vStock" hidden></section>
  <section id="vCons" hidden></section>
  <section id="vHist" hidden></section>
</div>
<datalist id="dl"></datalist>
<input type="file" id="xlFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="grip"></div><div id="sheetBody"></div></section>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const PD = "۰۱۲۳۴۵۶۷۸۹", AD = "٠١٢٣٤٥٦٧٨٩";
  const fa = s => String(s).replace(/\d/g, d => PD[+d]);
  const lat = s => String(s == null ? "" : s).replace(/[۰-۹]/g, d => PD.indexOf(d)).replace(/[٠-٩]/g, d => AD.indexOf(d));
  const num = s => { if (typeof s === "number") return isFinite(s) ? s : 0; const n = parseFloat(lat(s).replace(/[٬,،\s]/g, "").replace(/٫/g, ".")); return isFinite(n) ? n : 0; };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const p2 = n => (n < 10 ? "0" : "") + n;
  const iso = t => "⁦" + t + "⁩";
  const norm = s => String(s || "").replace(/ي/g, "ی").replace(/ك/g, "ک").replace(/[\s‌‏‎]/g, "").toLowerCase();
  /* quantities: up to two decimals, thousands separator, Persian digits */
  function fq(n) {
    n = Math.round((+n || 0) * 100) / 100;
    const neg = n < 0, parts = Math.abs(n).toString().split(".");
    return (neg ? "\u2066−" : "") + fa(parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "٬") + (parts[1] ? "٫" + parts[1] : "")) + (neg ? "\u2069" : "");
  }
  const money = n => fa(Math.round(n || 0).toLocaleString("en-US")).replace(/,/g, "٬");
  function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2800); }

  // ---------- dates (Shamsi) ----------
  function g2j(gy, gm, gd) {
    const gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    let jy = gy > 1600 ? 979 : 0; gy -= gy > 1600 ? 1600 : 621;
    const gy2 = gm > 2 ? gy + 1 : gy;
    let days = 365 * gy + ~~((gy2 + 3) / 4) - ~~((gy2 + 99) / 100) + ~~((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1];
    jy += 33 * ~~(days / 12053); days %= 12053;
    jy += 4 * ~~(days / 1461); days %= 1461;
    if (days > 365) { jy += ~~((days - 1) / 365); days = (days - 1) % 365; }
    const jm = days < 186 ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);
    const jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
    return [jy, jm, jd];
  }
  function j2g(jy, jm, jd) {
    jy += 1595;
    let days = -355668 + 365 * jy + ~~(jy / 33) * 8 + ~~(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : (jm - 7) * 30 + 186);
    let gy = 400 * ~~(days / 146097); days %= 146097;
    if (days > 36524) { gy += 100 * ~~(--days / 36524); days %= 36524; if (days >= 365) days++; }
    gy += 4 * ~~(days / 1461); days %= 1461;
    if (days > 365) { gy += ~~((days - 1) / 365); days = (days - 1) % 365; }
    let gd = days + 1;
    const sal = [0, 31, (gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0 ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    let gm = 0; while (gm < 13 && gd > sal[gm]) { gd -= sal[gm]; gm++; }
    return [gy, gm, gd];
  }
  const MONTHS = ["فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"];
  function jOf(ts) { const d = new Date(ts), j = g2j(d.getFullYear(), d.getMonth() + 1, d.getDate()); return { y: j[0], m: j[1], d: j[2] }; }
  const jShort = ts => { const j = jOf(ts); return fa(j.y + "/" + p2(j.m) + "/" + p2(j.d)); };
  const jLong = ts => { const j = jOf(ts); return fa(j.d) + " " + MONTHS[j.m - 1] + " " + fa(j.y); };
  const todayStr = () => jShort(Date.now());
  /* date ranges for the reports: presets or a custom from–to in Shamsi */
  const DAY = 864e5;
  const dayStart = ts => { const d = new Date(ts); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  const jStart = (y, m, d) => { const g = j2g(y, m, d); return new Date(g[0], g[1] - 1, g[2]).getTime(); };
  const PERS = [["all", "همهٔ زمان‌ها"], ["today", "امروز"], ["week", "این هفته"], ["month", "این ماه"], ["last", "ماه گذشته"], ["30", "۳۰ روز اخیر"], ["90", "۹۰ روز اخیر"], ["custom", "بازهٔ دلخواه…"]];
  function rangeOf(r) {
    const now = Date.now(), t = dayStart(now), nj = jOf(now);
    if (r.per === "today") return [t, t + DAY];
    if (r.per === "week") return [t - ((new Date(now).getDay() + 1) % 7) * DAY, t + DAY];
    if (r.per === "month") return [jStart(nj.y, nj.m, 1), t + DAY];
    if (r.per === "last") { let y = nj.y, m = nj.m - 1; if (m < 1) { m = 12; y--; } return [jStart(y, m, 1), jStart(nj.y, nj.m, 1)]; }
    if (r.per === "30") return [t - 29 * DAY, t + DAY];
    if (r.per === "90") return [t - 89 * DAY, t + DAY];
    if (r.per === "custom") { const a = r.from && parseJ(r.from), b = r.to && parseJ(r.to); return [a ? dayStart(a) : null, b ? dayStart(b) + DAY : null]; }
    return null;
  }
  const inRange = (ts, r) => { const g = rangeOf(r); return !g || ((g[0] === null || ts >= g[0]) && (g[1] === null || ts < g[1])); };
  function rangeLabel(r) {
    if (r.per !== "custom") return (PERS.find(x => x[0] === r.per) || PERS[0])[1];
    return (r.from ? "از " + iso(fa(lat(r.from))) : "") + (r.from && r.to ? " " : "") + (r.to ? "تا " + iso(fa(lat(r.to))) : "") || "همهٔ زمان‌ها";
  }
  const rangeBad = r => r.per === "custom" && ((r.from && !parseJ(r.from)) || (r.to && !parseJ(r.to)) || (r.from && r.to && parseJ(r.from) && parseJ(r.to) && dayStart(parseJ(r.from)) > dayStart(parseJ(r.to))));
  /* the period select (and the two date boxes when custom); k names the state object */
  const perHtml = (k, r) => '<div class="fld first"><label for="' + k + 'Per">بازهٔ زمانی</label><select class="field" id="' + k + 'Per" data-r="' + k + '" data-k="per">' +
    PERS.map(x => '<option value="' + x[0] + '"' + (r.per === x[0] ? " selected" : "") + '>' + x[1] + '</option>').join("") + '</select></div>' +
    (r.per === "custom" ? '<div class="two"><div class="fld"><label for="' + k + 'From">از تاریخ</label><input class="field" id="' + k + 'From" data-r="' + k + '" data-k="from" inputmode="numeric" placeholder="' + todayStr() + '" value="' + esc(r.from) + '" autocomplete="off"></div>' +
      '<div class="fld"><label for="' + k + 'To">تا تاریخ</label><input class="field" id="' + k + 'To" data-r="' + k + '" data-k="to" inputmode="numeric" placeholder="' + todayStr() + '" value="' + esc(r.to) + '" autocomplete="off"></div></div>' +
      (rangeBad(r) ? '<div class="err">تاریخ را به شکل ۱۴۰۵/۰۸/۱۴ بنویسید؛ «از» باید قبل از «تا» باشد.</div>' : '<div class="hint">هر کدام را خالی بگذارید، آن سمت بازه باز است.</div>') : '');
  /* "۱۴۰۵/۰۸/۱۴" → timestamp; today keeps the current time of day, other days sit at noon */
  function parseJ(s) {
    const m = lat(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
    if (!m) return null;
    const y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > (mo <= 6 ? 31 : mo <= 11 ? 30 : 30)) return null;
    const g = j2g(y, mo, d);
    if (lat(todayStr()) === y + "/" + p2(mo) + "/" + p2(d)) return Date.now();
    return new Date(g[0], g[1] - 1, g[2], 12, 0).getTime();
  }

  // ---------- storage ----------
  const KEY = "anbar-v1";
  /* items: {id:{name,unit}}  docs: {id:{id,type:in|out|mv,ts,projId,from,to,contractor,supplier,inv,amount,note,lines:[{i,q}],serial,hid}}  cons: own contractor names */
  let D = { items: {}, docs: {}, seq: {}, cons: [], cats: [] };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) D = Object.assign(D, s); } catch (e) {}
  if (!D.catsSeeded && !(D.cats || []).length) { D.cats = [{ id: "c1", name: "بنایی" }, { id: "c2", name: "تاسیسات" }, { id: "c3", name: "برق" }, { id: "c4", name: "متفرقه" }]; }
  D.catsSeeded = true; D.cats = D.cats || [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); return true; } catch (e) { toast("حافظهٔ گوشی پر است؛ ذخیره نشد. پشتیبان بگیرید."); return false; } }
  const newId = p => (p || "a") + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const curProject = () => (window.SA ? SA.current() : null);
  const projId = () => { const p = curProject(); return p ? p.id : "local"; };
  const locKey = L => (L === "C" ? "C" : "S:" + projId());
  const locName = k => (k === "C" ? "انبار مرکزی" : "انبار پروژه");
  const catName = id => { const c = D.cats.find(x => x.id === id); return c ? c.name : ""; };
  const findCat = n => { const k = norm(n); return k ? D.cats.find(c => norm(c.name) === k) || null : null; };
  function ensureCat(n) { n = String(n || "").trim(); if (!n) return ""; let c = findCat(n); if (!c) { c = { id: newId("c"), name: n }; D.cats.push(c); } return c.id; }
  const catOpts = (cur, ph) => '<option value="">' + (ph || "دسته…") + '</option>' + D.cats.map(c => '<option value="' + c.id + '"' + (cur === c.id ? " selected" : "") + '>' + esc(c.name) + '</option>').join("") + '<option value="__new">＋ دستهٔ جدید…</option>';
  function askCat() { const n = (prompt("نام دستهٔ تازه (مثلاً نقاشی، کناف، آهن‌آلات):") || "").trim().replace(/\s+/g, " "); if (!n) return ""; const id = ensureCat(n); save(); return id; }
  const items = () => Object.values(D.items).sort((a, b) => a.name.localeCompare(b.name, "fa"));
  const findItem = name => { const n = norm(name); if (!n) return null; return Object.values(D.items).find(i => norm(i.name) === n) || null; };

  /* stock of every location, worked out from all documents */
  function stockAll() {
    const s = {}, add = (l, i, q) => { if (!l) return; s[l] = s[l] || {}; s[l][i] = (s[l][i] || 0) + q; };
    Object.values(D.docs).forEach(d => d.lines.forEach(L => {
      if (d.type === "in") add(d.to, L.i, L.q);
      else if (d.type === "out") add(d.from, L.i, -L.q);
      else { add(d.from, L.i, -L.q); add(d.to, L.i, L.q); }
    }));
    return s;
  }
  /* contractors: the ones in دفتر کارکرد, the project's main contractor, the ones typed here, and any used before */
  function contractors() {

    const p = curProject(); if (p) add(p.contractor);
    (D.cons || []).forEach(add);

    return out.sort((a, b) => a.localeCompare(b, "fa"));

    h += '<div class="card"><h2>اقلام <small id="cnt">' + fa(F.rows.filter(r => r.name.trim()).length) + ' قلم</small></h2><div id="bulk">' + bulkHtml() + '</div><div id="rows">' + rowsHtml() + '</div>' +

  function stockRows() {
    const st = stockAll(), c = st.C || {}, s = st[locKey("S")] || {};
    return items().map(it => { const cv = c[it.id] || 0, sv = s[it.id] || 0; return { it, c: cv, s: sv, t: cv + sv, v: stLoc === "S" ? sv : stLoc === "C" ? cv : cv + sv }; });
  }
  const anyStock = r => (stLoc ? Math.abs(r.v) > 0.0001 : Math.abs(r.t) > 0.0001 || Math.abs(r.c) > 0.0001 || Math.abs(r.s) > 0.0001);
  const catMatch = r => !stCat || (stCat === "none" ? !r.it.cat || !catName(r.it.cat) : r.it.cat === stCat);
  /* rows grouped by category, in the order of the category list; items without a category last */
  function groups(rows) {
    const out = D.cats.map(c => ({ id: c.id, name: c.name, rows: rows.filter(r => r.it.cat === c.id) })).filter(g => g.rows.length);
    const none = rows.filter(r => !r.it.cat || !catName(r.it.cat)); if (none.length) out.push({ id: "", name: "بدون دسته", rows: none });
    return out;
  }
  function stockTableHtml() {
    const q = norm(stSearch);

    const cell = v => '<td class="n ' + (v < -0.0001 ? "neg" : Math.abs(v) < 0.0001 ? "zero" : "") + '">' + (Math.abs(v) < 0.0001 ? "—" : fq(v)) + '</td>';
    if (!rows.length) return '<div class="empty">' + (all.length ? "کالایی پیدا نشد." : "هنوز کالایی وارد انبار نشده. از بخش «ثبت» شروع کنید.") + '</div>';
    const name = r => '<td><button class="nmb" type="button" data-act="item" data-id="' + r.it.id + '">' + esc(r.it.name) + ' <small>(' + esc(r.it.unit) + ')</small></button></td>';

  /* what each contractor took from which warehouse, for the current project */
  function consData() {
    const map = {};
    myDocs().filter(d => d.type === "out").forEach(d => {
      if (!inRange(d.ts, cons)) return;
      if (cons.con && norm(d.contractor) !== norm(cons.con)) return;
      const k = d.from === "C" ? "C" : "S"; if (cons.loc && cons.loc !== k) return;

        const it = D.items[L.i]; if (!it || !catOk(it, cons.cat)) return;
        const m = map[d.contractor] = map[d.contractor] || {}, e = m[L.i] = m[L.i] || { S: 0, C: 0 }; e[k] += L.q;
      });
    });
    return Object.keys(map).sort((a, b) => a.localeCompare(b, "fa")).map(n => ({
      name: n, rows: Object.keys(map[n]).map(i => ({ it: D.items[i], s: map[n][i].S, c: map[n][i].C, q: map[n][i].S + map[n][i].C }))

    }));
  }

    if (d.amount > 0) { const h = toHesab(d); if (h) { d.hid = h; note = " و در دفتر حساب هم ثبت شد"; } else note = window.SV ? " (مبلغ با گزارش بعدی به دفتر حساب می‌رسد)" : " (این پروژه هنوز در دفتر حساب باز نشده؛ هزینه ثبت نشد)"; }
    if (!save()) { delete D.docs[d.id]; return; }
    F.rows = [blankRow()]; F.note = ""; F.supplier = ""; F.inv = ""; F.amount = ""; F.paid = "0"; F.date = "";
    if (F.type === "out") { F.con = contractor; F.newCon = ""; }
    render();
    if (d.type === "out") { toast("تحویل ثبت شد"); receiptImage(d); }
    else toast((d.type === "in" ? "ورود کالا ثبت شد" : "انتقال ثبت شد") + note);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- Excel import ----------
  function loadXlsx() {
    return new Promise((ok, no) => {
      if (window.XLSX) return ok();
      const s = document.createElement("script"); s.src = "../lib/xlsx.full.min.js"; s.onload = () => ok(); s.onerror = () => no(new Error("lib")); document.head.appendChild(s);
    });
  }
  const isNum = v => typeof v === "number" || (/^[\d۰-۹٠-٩.,٬٫\s]+$/.test(String(v)) && /[\d۰-۹٠-٩]/.test(String(v)));
  function parseSheet(a) {
    a = a.filter(r => r.some(c => String(c).trim() !== ""));
    if (!a.length) return null;
    const NAME = /(شرح|نام|کالا|عنوان|مورد|اقلام|محصول|مصالح|item|name|desc)/i, QTY = /(تعداد|مقدار|میزان|عدد|qty|quant|count)/i, UNIT = /(واحد|unit)/i, CAT = /(دسته|گروه|category|group)/i;
    let ni = -1, qi = -1, ui = -1, ci = -1, start = 0;
    for (let r = 0; r < Math.min(6, a.length); r++) {
      const n = a[r].findIndex(c => NAME.test(String(c))), q = a[r].findIndex(c => QTY.test(String(c)));
      if (n >= 0 && q >= 0 && n !== q) { ni = n; qi = q; ui = a[r].findIndex(c => UNIT.test(String(c))); ci = a[r].findIndex((c, k) => CAT.test(String(c)) && k !== n && k !== q); start = r + 1; break; }
    }
    if (ni < 0) {
      const body = a.slice(0, 60), nc = Math.max.apply(null, body.map(r => r.length)), st = [];
      for (let c = 0; c < nc; c++) {
        const vs = body.map(r => r[c] == null ? "" : r[c]).filter(v => String(v).trim() !== "");
        st.push({ c, n: vs.length, num: vs.filter(isNum).length / (vs.length || 1), len: vs.reduce((s, v) => s + String(v).length, 0) / (vs.length || 1),
          seq: body.filter((r, i) => num(r[c]) === i + 1).length / body.length > .6 });
      }
      const txt = st.filter(s => s.n && s.num < .4).sort((x, y) => y.len - x.len), nums = st.filter(s => s.n && s.num >= .7 && !s.seq);
      if (!txt.length || !nums.length) return null;
      ni = txt[0].c; qi = nums[0].c; const un = txt.find(s => s.c !== ni && s.len <= 12); ui = un ? un.c : -1; start = 0;
    }
    const out = [];
    a.slice(start).forEach(r => {
      const name = String(r[ni] == null ? "" : r[ni]).trim().replace(/\s+/g, " ");
      if (!name || /^(جمع|مجموع|total)/i.test(name)) return;
      out.push({ name, qty: r[qi] === "" || r[qi] == null ? "" : String(num(r[qi]) || ""), unit: ui >= 0 ? String(r[ui] == null ? "" : r[ui]).trim() : "", catName: ci >= 0 ? String(r[ci] == null ? "" : r[ci]).trim() : "" });
    });
    return out;
  }
  $("xlFile").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try {
      await loadXlsx();
      const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
      const rows = parseSheet(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" }));
      if (!rows) { toast("ستون‌ها تشخیص داده نشد. ستون‌ها باید «شرح کالا»، «تعداد» و «واحد» باشند."); return; }
      if (!rows.length) { toast("ردیفی در فایل پیدا نشد."); return; }
      const before = D.cats.length;
      rows.forEach(r => { r.cat = r.catName ? ensureCat(r.catName) : ""; delete r.catName; });
      if (D.cats.length > before) save();
      const keep = F.rows.filter(r => r.name.trim() || r.qty);
      F.rows = keep.concat(rows);
      const miss = rows.filter(r => !r.qty).length;
      render(); toast(fa(rows.length) + " قلم از فایل آمد" + (miss ? " · تعداد " + fa(miss) + " قلم خالی است" : "") + "؛ بررسی کنید.");
    } catch (er) { toast("فایل خوانده نشد: " + (er && er.message || er)); }
  });

  // ---------- events ----------
  document.addEventListener("input", e => {
    const el = e.target, rowEl = el.closest && el.closest(".irow");
    if (rowEl && el.dataset.f) {
      const r = F.rows[+rowEl.dataset.i]; if (!r) return;
      if (el.dataset.f === "cat" && el.value === "__new") { r.cat = askCat(); if (r.cat) lastCat = r.cat; render(); return; }
      r[el.dataset.f] = el.value; if (el.dataset.f === "cat" && el.value) lastCat = el.value;
      const c = $("cnt"); if (c) c.textContent = fa(F.rows.filter(x => x.name.trim()).length) + " قلم";
    } else if (el.dataset.g) {
      F[el.dataset.g] = el.value;
      if (el.dataset.g === "amount") { const had = !!$("fPaid"), has = num(el.value) > 0; if (had !== has) { const pos = el.selectionStart; viewNew(); const n = $("fAmt"); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} } } }
    } else if (el.id === "stQ") { stSearch = el.value; $("stTbl").innerHTML = stockTableHtml(); }
  });
  document.addEventListener("change", e => {
    const el = e.target, rowEl = el.closest && el.closest(".irow");
    if (rowEl && el.dataset.f === "name") {
      const r = F.rows[+rowEl.dataset.i], it = findItem(el.value), un = rowEl.querySelector(".un");
      const ct = rowEl.querySelector(".ct");
      if (it) { r.name = it.name; el.value = it.name; r.unit = it.unit; un.value = it.unit; un.readOnly = true; r.cat = it.cat || ""; ct.value = it.cat || ""; ct.disabled = true; } else { un.readOnly = false; ct.disabled = false; }
    } else if (el.dataset.g === "con") { if (el.value === "__new") { F.con = ""; conCtx = "form"; consSheet(); } else F.con = el.value; viewNew(); }
    else if (el.dataset.g === "paid") F.paid = el.value;
    else if (el.id === "iCat" && el.value === "__new") { const id = askCat(); render(); const sel = $("iCat"); sel.innerHTML = catOpts(id, "بدون دسته"); sel.value = id; }
    else if (el.id === "bulkSel") { if (el.value === "__new") { const id = askCat(); el.value = id; } if (el.value) { lastCat = el.value; F.rows.forEach(r => { if (r.name.trim() && !findItem(r.name) && !r.cat) r.cat = el.value; }); refreshRows(); } }
    else if (el.id === "stSel") { stCat = el.value; viewStock(); }
    else if (el.dataset.r) { const o = el.dataset.r === "cons" ? cons : hf; o[el.dataset.k] = el.value; if (el.dataset.r === "cons") viewCons(); else viewHist(); }
    else if (el.dataset.c) { cons[el.dataset.c] = el.value; $("cBody").innerHTML = consBody(); }
    else if (el.dataset.h) { hf[el.dataset.h] = el.value; viewHist(); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    const el = e.target, rowEl = el.closest && el.closest(".irow"); if (!rowEl) return;
    e.preventDefault();
    if (el.dataset.f === "name") { findItem(el.value) && el.dispatchEvent(new Event("change", { bubbles: true })); rowEl.querySelector(".qty").focus(); }
    else if (el.dataset.f === "qty") addRow();
  });
  function addRow() {
    F.rows.push(blankRow()); refreshRows();
    const last = $("rows").querySelector(".irow:last-child .nm"); if (last) last.focus();
  }
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
    if (a === "type") { F.type = v; F.loc = "S"; viewNew(); }
    else if (a === "loc") { F.loc = v; viewNew(); }
    else if (a === "dir") { F.dir = v; viewNew(); }
    else if (a === "add") addRow();
    else if (a === "rm") { const i = +el.dataset.i; if (F.rows.length > 1) F.rows.splice(i, 1); else F.rows = [blankRow()]; refreshRows(); }
    else if (a === "xl") { const f = $("xlFile"); f.value = ""; f.click(); }
    else if (a === "submit") submit();
    else if (a === "zero") { stZero = !stZero; viewStock(); }
    else if (a === "stloc") { stLoc = v; viewStock(); }
    else if (a === "item") itemSheet(id);
    else if (a === "cats") catsSheet();
    else if (a === "cons-mgr") { conCtx = v || ""; consSheet(); }
    else if (a === "con-add") {
      const n = $("conNew").value.trim().replace(/\s+/g, " "), er = m => { const b = $("cnErr"); b.textContent = m; b.hidden = false; };
      if (!n) return er("نام پیمانکار را بنویسید.");
      if (contractors().some(x => norm(x) === norm(n))) return er("این پیمانکار از قبل هست.");
      D.cons.push(n); if (!save()) return; if (conCtx === "form") F.con = n; render(); consSheet(); toast("پیمانکار اضافه شد");
    }
    else if (a === "con-ren") {
      const o = el.dataset.n, n = (prompt("نام تازهٔ پیمانکار:", o) || "").trim().replace(/\s+/g, " ");
      if (n && norm(n) !== norm(o) && !contractors().some(x => norm(x) === norm(n))) {
        D.cons = D.cons.map(x => norm(x) === norm(o) ? n : x); if (!D.cons.some(x => norm(x) === norm(n))) D.cons.push(n);
        Object.values(D.docs).forEach(d => { if (norm(d.contractor) === norm(o)) d.contractor = n; });
        if (cons.con && norm(cons.con) === norm(o)) cons.con = n; if (hf.con && norm(hf.con) === norm(o)) hf.con = n; if (F.con && norm(F.con) === norm(o)) F.con = n;
        save(); render(); consSheet();
      }
    }
    else if (a === "con-del") { const o = el.dataset.n; if (confirm("این پیمانکار حذف شود؟")) { D.cons = D.cons.filter(x => norm(x) !== norm(o)); if (F.con && norm(F.con) === norm(o)) F.con = ""; save(); render(); consSheet(); } }
    else if (a === "cat-add") { const n = $("catNew").value.trim().replace(/\s+/g, " "), er = m => { const b = $("cErr"); b.textContent = m; b.hidden = false; }; if (!n) return er("نام دسته را بنویسید."); if (findCat(n)) return er("این دسته از قبل هست."); D.cats.push({ id: newId("c"), name: n }); save(); render(); catsSheet(); }
    else if (a === "cat-ren") { const c = D.cats.find(x => x.id === id), n = c && (prompt("نام تازهٔ دسته:", c.name) || "").trim(); if (n && !(findCat(n) && findCat(n).id !== id)) { c.name = n; save(); render(); catsSheet(); } }
    else if (a === "cat-del") { if (confirm("این دسته حذف شود؟")) { D.cats = D.cats.filter(x => x.id !== id); save(); render(); catsSheet(); } }
    else if (a === "item-save") {
      const it = D.items[id], n = $("iName").value.trim().replace(/\s+/g, " "), u = $("iUnit").value.trim(), er = m => { const b = $("iErr"); b.textContent = m; b.hidden = false; };
      if (!n) return er("نام کالا را بنویسید.");
      const twin = findItem(n); if (twin && twin.id !== id) return er("کالای دیگری با همین نام هست.");
      it.name = n; it.unit = u || "عدد"; it.cat = $("iCat").value; if (save()) { closeSheet(); render(); toast("کالا به‌روز شد"); }
    }
    else if (a === "item-del") { if (confirm("این کالا حذف شود؟")) { delete D.items[id]; save(); closeSheet(); render(); } }
    else if (a === "img-stock") stockImage();
    else if (a === "img-cons") consImage();
    else if (a === "hist") { hist = v; viewHist(); }
    else if (a === "rcpt") { const d = D.docs[id]; if (d) receiptImage(d); }
    else if (a === "deldoc") {
      const d = D.docs[id]; if (!d) return;
      if (!confirm("این سند حذف شود؟ موجودی انبار دوباره حساب می‌شود" + (d.hid ? " و هزینهٔ آن از دفتر حساب هم برداشته می‌شود" : "") + ".")) return;
      fromHesab(d); delete D.docs[id]; save(); if (window.SV) SV.gone("anbar", id); render(); toast("سند حذف شد");
    }
    else if (a === "share-img") { if (lastBlob) deliver(lastBlob, lastName); }
    else if (a === "close") closeSheet();
  });
  $("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });

  showHead();
  const sp0 = curProject();
  if (!sp0) toast("پروژه‌ای انتخاب نشده؛ از صفحهٔ اصلی یک پروژه بسازید.");
  render();
  window.addEventListener("pageshow", () => { showHead(); render(); });
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }
})();
</script>
</body>
