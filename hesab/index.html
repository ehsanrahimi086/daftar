<script>
/* standalone: replaces the Claude-only services the artifact version uses */
window.DAFTAR_STANDALONE = true;
(function () {
  var DBN = "daftar-hesab", ST = "att";
  function open() {
    return new Promise(function (ok, no) {
      var r = indexedDB.open(DBN, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(ST); };
      r.onsuccess = function () { ok(r.result); };
      r.onerror = function () { no(r.error); };
    });
  }
  function run(mode, fn) {
    return open().then(function (db) {
      return new Promise(function (ok, no) {
        var t = db.transaction(ST, mode), out = fn(t.objectStore(ST));
        t.oncomplete = function () { ok(out && out.req ? out.req.result : (out && out.rows)); };
        t.onerror = function () { no(t.error); };
        t.onabort = function () { no(t.error || new Error("abort")); };
      });
    });
  }
  /* slip photos live in IndexedDB (room for many more than localStorage) */
  window.HESAB_ATT = {
    get: function (id) { return run("readonly", function (s) { return { req: s.get(id) }; }).then(function (v) { return v || null; }); },
    put: function (id, v) { return run("readwrite", function (s) { s.put(v, id); }); },
    del: function (id) { return run("readwrite", function (s) { s.delete(id); }); },
    clear: function () { return run("readwrite", function (s) { s.clear(); }); },
    all: function () {
      return run("readonly", function (s) {
        var o = { rows: [] };
        s.openCursor().onsuccess = function (e) { var c = e.target.result; if (c) { o.rows.push(Object.assign({ id: c.key }, c.value)); c.continue(); } };
        return o;
      });
    }
  };
  function save(o) {
    var blob = o.data, name = o.filename, file = null;
    try { file = new File([blob], name, { type: blob.type || "application/octet-stream" }); } catch (e) {}
    function dl() {
      var u = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      return Promise.resolve();
    }
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file] }).catch(function (e) {
        if (e && e.name === "AbortError") { var x = new Error("declined"); x.code = "declined"; throw x; }
        return dl();
      });
    }
    return dl();
  }
  window.claude = { use: function (n) { return n === "downloads" ? Promise.resolve({ save: save }) : Promise.reject(new Error("unavailable")); } };

  /* restore a backup made by «گرفتن پشتیبان» here or in the Claude version */
  window.HESAB_RESTORE = async function (file) {
    var j = JSON.parse(await file.text());
    if (!j || j.app !== "daftar-proje" || !Array.isArray(j.docs)) throw new Error("این فایل پشتیبان دفتر حساب نیست");
    var data = {}, att = [];
    j.docs.forEach(function (d) {
      if (d.col === "att") att.push([d.id, d.data]);
      else (data[d.col] = data[d.col] || {})[d.id] = d.data;
    });
    Object.keys(j.files || {}).forEach(function (id) { att.push([id, { d: j.files[id] }]); });
    localStorage.setItem("daftar-proje-v1", JSON.stringify(data));
    try { localStorage.setItem("daftar-cur-project", "main"); } catch (e) {}
    await window.HESAB_ATT.clear();
    for (var i = 0; i < att.length; i++) await window.HESAB_ATT.put(att[i][0], att[i][1]);
    return { docs: j.docs.length - att.length, att: att.length };
  };

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest && ev.target.closest("[data-act]");
    if (!el) return;
    if (el.dataset.act === "sa-restore") { var f = document.getElementById("saRestore"); if (f) { f.value = ""; f.click(); } }
    if (el.dataset.act === "sa-imp") {
      var c = document.querySelector("#sheetBody [data-act=close]"); if (c) c.click();
      var b = document.createElement("button"); b.type = "button"; b.dataset.act = "tab"; b.dataset.tab = "imp"; b.hidden = true;
      document.body.appendChild(b); b.click(); b.remove();
    }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id !== "saRestore" || !t.files || !t.files[0]) return;
    if (!confirm("همهٔ اطلاعات فعلی دفتر حساب روی این گوشی با اطلاعات فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟")) return;
    window.HESAB_RESTORE(t.files[0]).then(function (r) {
      alert("بازگردانی انجام شد: " + r.docs + " ردیف" + (r.att ? " و " + r.att + " عکس" : ""));
      location.reload();
    }, function (e) { alert("بازگردانی نشد: " + (e && e.message || e)); });
  });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(function () {});
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
})();
</script>

<style>
/* Layout: phone-first ledger. Sticky page head, stacked row cards, fixed bottom tab bar, bottom-sheet forms. */
:root{
  --ground:#EEF2F5; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#14222B; --muted:#5A6B77; --line:#D8E0E6;
  --accent:#0D5C6E; --accent-ink:#FFFFFF; --accent-soft:#DCEEF2;
  --debt:#B3261E; --debt-soft:#FBE7E5; --credit:#17703F; --credit-soft:#DFF3E7; --warn:#8A5A00; --warn-soft:#FBEFD5;
  --font-body:'Vazirmatn',Tahoma,system-ui,sans-serif; --font-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --r-sm:8px; --r-md:12px; --shadow:0 -6px 24px rgba(10,24,32,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E151A; --surface:#151F26; --surface-2:#1B2831; --ink:#E6EDF1; --muted:#93A4B0; --line:#263641;
    --accent:#4FB4C8; --accent-ink:#06222A; --accent-soft:#163540;
    --debt:#FF8A80; --debt-soft:#3A1E1C; --credit:#6FD39A; --credit-soft:#15301F; --warn:#E8B65A; --warn-soft:#33280F;
    --shadow:0 -6px 24px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E151A; --surface:#151F26; --surface-2:#1B2831; --ink:#E6EDF1; --muted:#93A4B0; --line:#263641;
  --accent:#4FB4C8; --accent-ink:#06222A; --accent-soft:#163540;
  --debt:#FF8A80; --debt-soft:#3A1E1C; --credit:#6FD39A; --credit-soft:#15301F; --warn:#E8B65A; --warn-soft:#33280F;
  --shadow:0 -6px 24px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin-inline:auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.head .eyebrow{margin:0;font-size:.74rem;color:var(--muted);line-height:1.4}
.proj-btn{display:inline-flex;align-items:center;gap:4px;max-width:100%;margin:0;margin-inline-start:-6px;padding:4px 6px;min-height:32px;border:0;border-radius:8px;background:none;color:var(--accent);font-size:.8rem;font-weight:700;line-height:1.4;text-align:start;overflow-wrap:anywhere}
.proj-btn:active{background:var(--accent-soft)}
.proj-btn .pc{font-weight:500;color:var(--muted);font-size:.72rem;white-space:nowrap}
.head h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:1.65rem;line-height:1.3}
.pad{padding:24px 0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--debt);border-color:var(--debt)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.82rem}
.btn[disabled]{opacity:.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;min-width:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 8px}
.sec h2{margin:0;font-size:.95rem;font-weight:800}
.sec span{font-size:.78rem;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;min-width:0}
.tile .lbl{font-size:.78rem;color:var(--muted);font-weight:500}
.tile .val{font-size:1.2rem;font-weight:800;line-height:1.35;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile .unit{font-size:.7rem;font-weight:500;color:var(--muted);margin-inline-start:4px}
.tile .hint{font-size:.72rem;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.credit{color:var(--credit)} .debt{color:var(--debt)} .accent{color:var(--accent)} .warn{color:var(--warn)}
.cash{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.cash .lbl{font-weight:700;font-size:.9rem}
.cash .sub{font-size:.72rem;color:var(--muted)}
.cash .val{font-size:1.15rem;font-weight:800;text-align:end;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.bars .nm{font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.bars .am{font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.bars .tr{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bars .tr i{display:block;height:100%;width:var(--w,0%);background:var(--accent);border-radius:99px}
.bars .md{grid-column:1/-1;font-size:.72rem;color:var(--muted)}
.lines{margin:0;display:flex;flex-direction:column;gap:8px}
.lines div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lines dt{color:var(--muted);font-size:.85rem}
.lines dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:end;overflow-wrap:anywhere}
.lines .tot{border-top:1px solid var(--line);padding-top:8px}
.party-li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.party-li:last-child{border-bottom:0}
.party-li .n{min-width:0;overflow-wrap:anywhere;font-weight:600}
.party-li .a{font-weight:700;font-variant-numeric:tabular-nums}
.banner{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-md);padding:10px 14px;font-size:.84rem}
.banner b{font-weight:800}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tools input[type=search]{flex:1 1 180px;min-width:0}
.chip-btn{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600}
.chip-btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sumline{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.sumline b{color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer}
.row:active{background:var(--surface-2)}
.row-top{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted)}
.row-top .sp{flex:1}
.row h3{margin:0;font-size:.95rem;font-weight:700;overflow-wrap:anywhere;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:.8rem;color:var(--muted)}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:0 10px;font-size:.74rem;color:var(--ink)}
.pill{font-size:.72rem;padding:1px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.pill.debt{background:var(--debt-soft);color:var(--debt)}
.pill.ok{background:var(--credit-soft);color:var(--credit)}
.pill.pre{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding-top:8px;border-top:1px dashed var(--line)}
.nums.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.nums dt{font-size:.7rem;color:var(--muted)}
.nums dd{margin:0;font-weight:700;font-size:.88rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.row-act{display:flex;justify-content:flex-end}
.empty{border:1px dashed var(--line);border-radius:var(--r-md);padding:28px 16px;text-align:center;color:var(--muted);margin-top:14px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin-inline:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;background:none;border:0;color:var(--muted);font-size:.64rem;font-weight:500;min-height:56px}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent);font-weight:800}
.scrim{position:fixed;inset:0;background:rgba(10,18,24,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:760px;margin-inline:auto;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:0 0 12px;font-family:var(--font-display);font-weight:400;font-size:1.35rem}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;min-width:0}
.fld>label,.fld>.l{font-size:.8rem;color:var(--muted);font-weight:500}
.fld .h{font-size:.72rem;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

input[type=text],input[type=search],input:not([type]),select{width:100%;min-height:46px;padding:9px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}

.seg input:checked+span{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

.prev{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.86rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.err{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--debt-soft);color:var(--debt);font-size:.84rem;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.acts .grow{flex:1 1 140px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;font-size:.84rem;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.setrow:last-child{border-bottom:0}
.setrow .n{min-width:0;overflow-wrap:anywhere;font-weight:600}
.setrow .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);margin-top:10px}
.tbl{border-collapse:collapse;width:100%;min-width:480px;font-size:.8rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:700;white-space:nowrap}
.tbl tfoot td{font-weight:800;background:var(--surface-2);border-bottom:0}

.tbl tr:last-child td{border-bottom:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.pay-li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.pay-li span{min-width:0;overflow-wrap:anywhere}
input[type=file]{width:100%;min-height:46px;padding:9px 12px;font-size:14px;border:1px dashed var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--ink)}

<script>
(function(){
'use strict';
var D=document;
D.documentElement.lang='fa'; D.documentElement.dir='rtl';
var $=function(s,r){return (r||D).querySelector(s)};

/* ---------- helpers: digits, money, dates ---------- */
var PD='۰۱۲۳۴۵۶۷۸۹', AD='٠١٢٣٤٥٦٧٨٩';
function toLatin(s){return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return PD.indexOf(d)}).replace(/[٠-٩]/g,function(d){return AD.indexOf(d)})}
function faDigits(s){return String(s).replace(/\d/g,function(d){return PD[+d]})}
function parseNum(s){var t=toLatin(s).replace(/[٬,،\s‎‏]/g,'').replace(/٫/g,'.').replace(/[−–]/g,'-');var n=parseFloat(t);return isFinite(n)?n:0}
function fmt(n){return (Math.round((+n||0)*100)/100).toLocaleString('fa-IR')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function g2j(gy,gm,gd){
  var gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  var jy=(gy>1600)?979:0; gy-=(gy>1600)?1600:621;
  var gy2=(gm>2)?(gy+1):gy;
  var days=(365*gy)+(~~((gy2+3)/4))-(~~((gy2+99)/100))+(~~((gy2+399)/400))-80+gd+gdm[gm-1];
  jy+=33*(~~(days/12053)); days%=12053;
  jy+=4*(~~(days/1461)); days%=1461;
  if(days>365){jy+=~~((days-1)/365); days=(days-1)%365}
  var jm=(days<186)?1+~~(days/31):7+~~((days-186)/30);
  var jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function pad2(n){return (n<10?'0':'')+n}
function todayJ(){var t=new Date();var a=g2j(t.getFullYear(),t.getMonth()+1,t.getDate());return a[0]+'/'+pad2(a[1])+'/'+pad2(a[2])}
function normDate(s){
  var m=toLatin(s).trim().match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(!m) return null;
  var y=+m[1],mo=+m[2],d=+m[3];
  if(mo<1||mo>12||d<1||d>(mo<=6?31:30)) return null;
  return y+'/'+pad2(mo)+'/'+pad2(d);
}
function showDate(s){return s?faDigits(s):''}

/* ---------- storage: shared db when available, else this browser ---------- */
var store=null;
function localStore(){
  var KEY='daftar-proje-v1', data={}, subs={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){try{toast('حافظهٔ گوشی پر است؛ ذخیره نشد. پشتیبان بگیرید.')}catch(_){}}}
  function list(c){return Object.keys(data[c]||{}).map(function(id){return Object.assign({id:id},data[c][id])})}
  function emit(c){(subs[c]||[]).forEach(function(f){f(list(c))})}
  var A=window.HESAB_ATT;
  function isA(c){return c==='att'&&A}
  return {
    mode:'local',
    newId:function(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)},
    has:function(c,id){if(isA(c))return A.get(id).then(function(v){return !!v});return Promise.resolve(!!(data[c]&&data[c][id]))},
    get:function(c,id){if(isA(c))return A.get(id);return Promise.resolve(data[c]&&data[c][id]?JSON.parse(JSON.stringify(data[c][id])):null)},
    watch:function(c,f){if(isA(c)){var on=true;A.all().then(function(r){if(on)f(r)},function(){if(on)f([])});return function(){on=false}}var arr=(subs[c]=subs[c]||[]);arr.push(f);setTimeout(function(){if(arr.indexOf(f)>=0)f(list(c))},0);return function(){var i=arr.indexOf(f);if(i>=0)arr.splice(i,1)}},
    put:function(c,id,v){if(isA(c))return A.put(id,JSON.parse(JSON.stringify(v)));(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(v));persist();emit(c);return Promise.resolve()},
    del:function(c,id){if(isA(c))return A.del(id);if(data[c])delete data[c][id];persist();emit(c);return Promise.resolve()}
  };
}
function dbStore(db){
  return {
    mode:'db',
    newId:function(){return db.collection('ids').doc().id},
    has:function(c,id){return db.doc(c+'/'+id).get().then(function(s){return s.exists})},
    get:function(c,id){return db.doc(c+'/'+id).get().then(function(s){return s.exists?s.data():null})},
    watch:function(c,f){
      return db.collection(c).onSnapshot(function(s){
        f(s.docs.map(function(d){return Object.assign({id:d.id},d.data())}));
      },function(e){console.error(e);toast('همگام‌سازی قطع شد'+(e&&e.code?' ('+e.code+')':''))});
    },
    put:function(c,id,v){return db.doc(c+'/'+id).set(v)},
    del:function(c,id){return db.doc(c+'/'+id).delete()}
  };
}

/* ---------- projects: each project keeps its own ledger; parties are shared ---------- */
var BASE=null, PFX='', PROJ={list:[],cur:'main',ready:false}, UNSUBS=[], UID='', USER=null, NAMES={};
var SHARED={parties:1,projects:1,att:1}, STAMP={expenses:1,receipts:1,draws:1};
function cname(c){return SHARED[c]?c:PFX+c}
function scoped(b){
  return {
    mode:b.mode,newId:b.newId,
    has:function(c,id){return b.has(cname(c),id)},
    get:function(c,id){return b.get(cname(c),id)},
    watch:function(c,f){return b.watch(cname(c),f)},
    put:function(c,id,v){
      if(STAMP[c]&&UID){var o=byId(S[c]||[],id);v=Object.assign({},v);v.by=(o&&o.by)||v.by||UID}
      return b.put(cname(c),id,v);
    },
    del:function(c,id){return b.del(cname(c),id)}
  };
}
function projName(id){if(id===PROJ.cur)return S.cfg.project||'پروژه';var x=byId(PROJ.list,id);return x?x.name:(id==='main'?'پروژهٔ اول':'پروژه')}
function projRows(){
  var rows=PROJ.list.slice();
  if(!byId(rows,'main')) rows.unshift({id:'main',name:PROJ.cur==='main'?(S.cfg.project||'پروژهٔ اول'):'پروژهٔ اول',order:0});
  return rows.sort(function(a,b){return (a.order||0)-(b.order||0)});
}
async function openProject(id){
  UNSUBS.forEach(function(u){try{if(typeof u==='function')u()}catch(e){}});UNSUBS=[];
  PROJ.cur=id; PFX=id==='main'?'':'projects/'+id+'/';
  try{localStorage.setItem('daftar-cur-project',id)}catch(e){}
  S={cats:[],parties:S.parties||[],expenses:[],receipts:[],draws:[],banks:[],cfg:defaults()};
  loaded={}; UI.party=null; UI.q=''; UI.onlyDebt=false;
  if(typeof SCAN!=='undefined'){SCAN.items=[];SCAN.imgs=[];SCAN.msg=''}
  if(typeof REP!=='undefined'){REP.from='';REP.to=''}
  if(typeof IMP!=='undefined'){IMP.wb=null;IMP.aoa=[];IMP.file='';IMP.msg=''}
  if(UI.tab==='imp'||UI.tab==='rep') UI.tab='dash';
  closeSheet(); render();
  if(id==='main'){try{if(!(await store.has('settings','main')))await seed()}catch(e){console.error(e)}}
  COLS.forEach(function(c){UNSUBS.push(store.watch(c,function(rows){ingest(c,rows)}))});
}
async function createProject(name){
  name=name.trim(); if(!name) return;
  if(!byId(PROJ.list,'main')) await BASE.put('projects','main',{name:PROJ.cur==='main'?(S.cfg.project||'پروژهٔ اول'):'پروژهٔ اول',order:0});
  var id=BASE.newId(), u=S.cfg.unit||'تومان', r=+S.cfg.rate||0;
  await BASE.put('projects',id,{name:name,order:Date.now()});
  await BASE.put('projects/'+id+'/settings','main',Object.assign(defaults(),{project:name,unit:u,rate:r}));
  await openProject(id);
}
function projHtml(){
  var rows=projRows();
  return '<h2>پروژه‌ها</h2><div class="list" style="margin-top:0">'+rows.map(function(x){
    var cur=x.id===PROJ.cur;
    return '<button class="setrow" type="button" data-act="proj-open" data-id="'+esc(x.id)+'" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start"'+(cur?' aria-current="true"':'')+'><span class="n">'+esc(cur?(S.cfg.project||x.name):x.name)+'</span><span class="r">'+(cur?'<span class="pill ok">باز است</span>':'<span class="muted">باز کردن ‹</span>')+'</span></button>';
  }).join('')+'</div>'+
  '<form data-form="proj" novalidate style="margin-top:16px">'+fld('پروژهٔ جدید','<input id="f-pname" name="name" autocomplete="off" placeholder="مثلاً ساختمان ولنجک">','هر پروژه دفتر، معین‌ها، حساب‌ها و گزارش جدا دارد. طرف‌حساب‌ها بین پروژه‌ها مشترک‌اند.','f-pname')+
  '<div class="acts"><button class="btn primary grow" type="submit">ایجاد و باز کردن</button><button class="btn" type="button" data-act="close">بستن</button></div></form>'+
  '<p class="note">نام هر پروژه را در «بیشتر ← عمومی» عوض کنید.</p>';
}
function whoHtml(x){
  if(!x||!x.by||!USER) return '';
  var n=NAMES[x.by];
  if(n===undefined){NAMES[x.by]=null;USER.profiles([x.by]).then(function(ps){var q=ps&&ps[x.by];NAMES[x.by]=(q&&q.name)||'';var el=$('[data-who="'+x.by+'"]');if(el)el.textContent=NAMES[x.by]||'نامشخص'},function(){NAMES[x.by]=''})}
  return '<p class="note" style="margin:0 0 12px">ثبت‌شده توسط <b data-who="'+esc(x.by)+'">'+esc(n?n:(n===''?'نامشخص':'…'))+'</b></p>';
}

/* ---------- state ---------- */
function defaults(){return {unit:'تومان',rate:0,wageMode:'percent',wagePct:0,wageFixed:0,wageBase:'cost',project:'پروژه من'}}
var S={cats:[],parties:[],expenses:[],receipts:[],draws:[],banks:[],cfg:defaults()};
var loaded={};
var UI={tab:'dash',q:'',onlyDebt:false,party:null,sheet:null};
var ROLES=['شریک','فروشنده','پیمانکار','کارفرما','صرافی','سایر'];
var TRADES=['کناف کار','لوله اتصالات فروش','برق کار','نقاش','کاشی کار','باربری'];
var BANKS=['ملی','ملت','صادرات','تجارت','سپه','کشاورزی','پاسارگاد','سامان','پارسیان','آینده','رفاه','مسکن'];

function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null}
function catName(id){var x=byId(S.cats,id);return x?x.name:''}
function pname(x){return ((x.trade?x.trade+' ':'')+(x.name||'')).trim()}
function partyName(id){var x=byId(S.parties,id);return x?pname(x):''}
function bankName(id){var x=byId(S.banks,id);return x?x.name:''}
function normExp(e){
  var pays=Array.isArray(e.pays)?e.pays:((+e.paid>0)?[{d:e.date,a:+e.paid,b:e.bank||''}]:[]);
  return Object.assign({},e,{pays:pays,paid:sum(pays,function(p){return p.a})});
}
function bankBal(){
  var m={}, un={b:{id:'',name:'بدون حساب مشخص'},open:0,inn:0,out:0};
  S.banks.forEach(function(b){m[b.id]={b:b,open:+b.opening||0,inn:0,out:0}});
  function slot(id){return (id&&m[id])||un}
  S.receipts.forEach(function(r){slot(r.bank).inn+=+r.base||0});
  S.expenses.forEach(function(e){(e.pays||[]).forEach(function(p){slot(p.b).out+=+p.a||0})});
  S.draws.forEach(function(d){slot(d.bank).out+=+d.amount||0});
  var rows=S.banks.map(function(b){return m[b.id]});
  if(un.inn||un.out) rows.push(un);
  rows.forEach(function(r){r.bal=r.open+r.inn-r.out});
  return rows;
}
function sum(arr,f){var t=0;for(var i=0;i<arr.length;i++)t+=(+f(arr[i])||0);return t}
function nextNo(arr){var m=0;arr.forEach(function(x){if(x.no>m)m=x.no});return m+1}
function unit(){return esc(S.cfg.unit||'تومان')}

function calc(){
  var cost=sum(S.expenses,function(e){return e.total}), paid=sum(S.expenses,function(e){return e.paid});
  var rec=sum(S.receipts,function(r){return r.base});
  var wd=sum(S.draws.filter(function(d){return d.kind==='wage'}),function(d){return d.amount});
  var gen=sum(S.draws.filter(function(d){return d.kind!=='wage'}),function(d){return d.amount});
  var base=S.cfg.wageBase==='paid'?paid:cost;
  var due=S.cfg.wageMode==='fixed'?(+S.cfg.wageFixed||0):base*(+S.cfg.wagePct||0)/100;
  var open=sum(S.banks,function(b){return b.opening});
  return {cost:cost,paid:paid,debt:cost-paid,rec:rec,wd:wd,gen:gen,base:base,due:due,owed:due-wd,cash:open+rec-paid-wd-gen};
}
function wageDefined(){return S.cfg.wageMode==='fixed'?(+S.cfg.wageFixed>0):(+S.cfg.wagePct>0)}
function hasSample(){
  return !!S.cfg.sample||['expenses','receipts','draws','cats','banks'].concat(PROJ.cur==='main'?['parties']:[]).some(function(c){return S[c].some(function(x){return x.sample})});
}

/* ---------- seed (marked examples) ---------- */
async function seed(){
  var id=function(){return store.newId()};
  var c={kanaf:id(),mat:id(),wage:id(),haml:id(),misc:id()};
  var p={me:id(),partner:id(),shop:id(),usta:id(),bar:id(),owner:id()};
  var T={sample:true};
  function w(col,i,v){return store.put(col,i,Object.assign({},v,T))}
  await store.put('settings','main',Object.assign(defaults(),{rate:95000,wagePct:10,project:'پروژه نمونه'},T));
  var cats=[['kanaf','کناف'],['mat','مصالح'],['wage','دستمزد'],['haml','حمل و نقل'],['misc','متفرقه']];
  for(var i=0;i<cats.length;i++) await w('cats',c[cats[i][0]],{name:cats[i][1]});
  var parties=[['me','شریک اول (من)','شریک'],['partner','شریک دوم','شریک'],['shop','فروشگاه مرادی','فروشنده'],['usta','استاد رضایی','پیمانکار'],['bar','باربری کرمی','فروشنده'],['owner','کارفرما','کارفرما']];
  for(i=0;i<parties.length;i++) await w('parties',p[parties[i][0]],{name:parties[i][1],role:parties[i][2]});
  var ex=[
    [1,'1405/06/20','ورق کناف ۱۲٫۵ میل، ۱۲۰ عدد','kanaf','shop',36000000,36000000],
    [2,'1405/06/24','پروفیل و نبشی','mat','shop',18500000,10000000],
    [3,'1405/07/02','دستمزد نصب کناف طبقه اول','wage','usta',22000000,12000000],
    [4,'1405/07/05','کرایه حمل مصالح','haml','bar',1800000,1800000],
    [5,'1405/07/09','پیچ، رول‌پلاک و بتونه','mat','shop',4200000,0]
  ];
  for(i=0;i<ex.length;i++) await w('expenses',id(),{no:ex[i][0],date:ex[i][1],desc:ex[i][2],cat:c[ex[i][3]],party:p[ex[i][4]],total:ex[i][5],paid:ex[i][6]});
  await w('receipts',id(),{no:1,date:'1405/06/15',desc:'پیش‌پرداخت کارفرما',from:p.owner,cur:'IRR',amount:80000000,rate:0,base:80000000});
  await w('receipts',id(),{no:2,date:'1405/07/06',desc:'قسط دلاری',from:p.owner,cur:'USD',amount:1000,rate:95000,base:95000000});
  await w('draws',id(),{no:1,date:'1405/07/08',who:p.me,kind:'wage',desc:'علی‌الحساب دستمزد',amount:3000000});
  await w('draws',id(),{no:2,date:'1405/07/10',who:'',kind:'general',desc:'اجاره دفتر مرکزی',amount:5000000});
}
async function wipeSample(){
  var keep={cats:{},parties:{}};
  S.expenses.filter(function(x){return !x.sample}).forEach(function(e){keep.cats[e.cat]=1;keep.parties[e.party]=1});
  S.receipts.filter(function(x){return !x.sample}).forEach(function(r){keep.parties[r.from]=1;keep.parties[r.via]=1});
  S.draws.filter(function(x){return !x.sample}).forEach(function(d){keep.parties[d.who]=1});
  var cols=['expenses','receipts','draws'], i, j, x;
  for(i=0;i<cols.length;i++){var rows=S[cols[i]].slice();for(j=0;j<rows.length;j++){x=rows[j];if(x.sample) await store.del(cols[i],x.id)}}
  var cp=PROJ.cur==='main'?['cats','parties']:['cats'];
  for(i=0;i<cp.length;i++){
    var rows2=S[cp[i]].slice();
    for(j=0;j<rows2.length;j++){
      x=rows2[j];
      if(!x.sample) continue;
      if(keep[cp[i]][x.id]){var v=Object.assign({},x);delete v.id;delete v.sample;await store.put(cp[i],x.id,v)}
      else await store.del(cp[i],x.id);
    }
  }
  if(S.cfg.sample){var u=defaults();u.unit=S.cfg.unit||'تومان';await store.put('settings','main',u)}
}

/* ---------- boot / ingest ---------- */
var COLS=['cats','parties','expenses','receipts','draws','banks','settings'];
var raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;refresh()})}
function ingest(c,rows){
  if(c==='settings'){
    var m=rows.filter(function(r){return r.id==='main'})[0]||{};
    var v=Object.assign(defaults(),m);delete v.id;S.cfg=v;
  } else S[c]=(c==='expenses')?rows.map(normExp):rows;
  loaded[c]=true;
  if(COLS.every(function(k){return loaded[k]})) schedule();
}
async function boot(){
  $('#view').innerHTML='<p class="muted pad">در حال بارگذاری…</p>';
  drawChrome();
  var db=null;
  try{db=(window.claude&&window.claude.use)?await window.claude.use('db'):null}catch(e){db=null}
  BASE=db?dbStore(db):localStore(); store=scoped(BASE);
  try{USER=(window.claude&&window.claude.use)?await window.claude.use('user'):null}catch(e){USER=null}
  if(USER){try{UID=await USER.id()||''}catch(e){UID=''}}
  BASE.watch('projects',function(rows){
    PROJ.list=rows;
    if(!PROJ.ready){PROJ.ready=true;if(PROJ.cur!=='main'&&!byId(rows,PROJ.cur)){openProject('main');return}}
    if(COLS.every(function(k){return loaded[k]})) drawChrome();
  });
  var last='main'; try{last=localStorage.getItem('daftar-cur-project')||'main'}catch(e){}
  await openProject(last);
}

var REP={from:'',to:'',busy:false,sec:{sum:true,cat:true,exp:true,rec:true,party:true,draw:false,docs:true}};
function cmpDate(a,b){var x=a.date||'',y=b.date||'';return x<y?-1:(x>y?1:((a.no||0)-(b.no||0)))}
function repData(){
  var f=normDate(REP.from)||'', t=normDate(REP.to)||'';
  function inr(d){d=d||'';return (!f||d>=f)&&(!t||d<=t)}
  var ex=S.expenses.filter(function(e){return inr(e.date)}).sort(cmpDate);
  var rc=S.receipts.filter(function(r){return inr(r.date)}).sort(cmpDate);
  var dr=S.draws.filter(function(x){return inr(x.date)}).sort(cmpDate);
  var tot={cost:sum(ex,function(e){return e.total}),paid:sum(ex,function(e){return e.paid}),rec:sum(rc,function(r){return r.base}),
    usd:sum(rc.filter(function(r){return r.cur==='USD'}),function(r){return r.amount})};
  tot.debt=tot.cost-tot.paid;
  var cm={}, pm={};
  ex.forEach(function(e){
    var ck=e.cat||'-', co=cm[ck]||(cm[ck]={name:e.cat?catName(e.cat):'بدون معین',t:0,p:0}); co.t+=+e.total||0; co.p+=+e.paid||0;
    var pk=e.party||'-', po=pm[pk]||(pm[pk]={name:e.party?partyName(e.party):'بدون طرف‌حساب',t:0,p:0}); po.t+=+e.total||0; po.p+=+e.paid||0;
  });
  var cats=Object.keys(cm).map(function(k){return cm[k]}).sort(function(a,b){return b.t-a.t});
  var parties=Object.keys(pm).map(function(k){return pm[k]}).sort(function(a,b){return (b.t-b.p)-(a.t-a.p)});
  return {f:f,t:t,ex:ex,rc:rc,dr:dr,tot:tot,cats:cats,parties:parties};
}
/* one page per distinct image; the tables point to the page */
function repDocs(d){
  var pages=[], at={};
  function add(id,cap,key){
    if(!id) return; var p=at[id];
    if(!p){p=at[id]={id:id,page:pages.length+1,caps:[]};pages.push(p)}
    if(p.caps.indexOf(cap)<0) p.caps.push(cap);
    (add.ref[key]=add.ref[key]||[]).indexOf(p.page)<0&&add.ref[key].push(p.page);
  }
  add.ref={};
  d.ex.forEach(function(e){
    (e.att||[]).forEach(function(id){add(id,'هزینهٔ ردیف '+fmt(e.no)+' — '+showDate(e.date)+' — '+e.desc+' — '+fmt(e.total)+' '+unit(),'e'+e.id)});
    (e.pays||[]).forEach(function(p){if(p.at)add(p.at,'پرداخت بابت ردیف '+fmt(e.no)+' — '+showDate(p.d)+' — '+fmt(p.a)+' '+unit()+(e.party?' — '+partyName(e.party):''),'e'+e.id)});
  });
  d.rc.forEach(function(r){(r.att||[]).forEach(function(id){add(id,'دریافتی ردیف '+fmt(r.no)+' — '+showDate(r.date)+' — '+fmt(r.base)+' '+unit()+(r.from?' — '+partyName(r.from):''),'r'+r.id)})});
  if(REP.sec.draw) d.dr.forEach(function(x){(x.att||[]).forEach(function(id){add(id,'برداشت ردیف '+fmt(x.no)+' — '+showDate(x.date)+' — '+fmt(x.amount)+' '+unit(),'w'+x.id)})});
  return {pages:pages,ref:add.ref};
}
function pgRef(docs,key){var a=docs&&docs.ref[key];return a&&a.length?'ص '+a.map(function(n){return fmt(n)}).join('، '):''}
function repModel(){

    foot:['','','','','جمع',t.usd||'','',t.rec,'','']});
  if(sec.rec&&d.rc.length) T[T.length-1]=withDocs(T[T.length-1],docs,d.rc.map(function(r){return 'r'+r.id}));
  if(sec.party&&d.parties.length) T.push({title:'مانده طرف‌حساب‌ها',cols:[['طرف‌حساب','t'],['مبلغ کل','n'],['پرداخت‌شده','n'],['مانده','n']],
    rows:d.parties.map(function(p){return [p.name,p.t,p.p,p.t-p.p]}),foot:['جمع',t.cost,t.paid,t.debt]});
  if(sec.draw&&d.dr.length) T.push({title:'برداشت‌ها',cols:[['ردیف','n'],['تاریخ','d'],['نوع','t'],['برداشت‌کننده','t'],['شرح','t'],['مبلغ','n']],
    rows:d.dr.map(function(x){return [x.no,x.date,x.kind==='wage'?'دستمزد':'هزینه عمومی',x.who?partyName(x.who):'',x.desc||'',x.amount]}),foot:['','','','','جمع',sum(d.dr,function(x){return x.amount})]});

  return {tables:T,period:period,d:d,docs:docs};
}
function withDocs(tb,docs,keys){
  if(!docs||!keys.some(function(k){return docs.ref[k]})) return tb;
  tb.cols=tb.cols.concat([['مدرک','t']]);
  tb.rows=tb.rows.map(function(r,i){return r.concat([pgRef(docs,keys[i])])});
  if(tb.foot) tb.foot=tb.foot.concat(['']);
  return tb;
}

async function exportXlsx(){

    var aoa=[[S.cfg.project],['گزارش مالی · '+m.period+' · مبالغ به '+(S.cfg.unit||'تومان')],[],tb.cols.map(function(c){return c[0]})];

function cellDate(v){
  if(v===''||v==null) return null;
  var a;
  if(v instanceof Date){a=g2j(v.getFullYear(),v.getMonth()+1,v.getDate());return a[0]+'/'+pad2(a[1])+'/'+pad2(a[2])}
  if(typeof v==='number'){
    if(v>20000&&v<80000){var dt=new Date(Math.round((v-25569)*86400000));a=g2j(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());return a[0]+'/'+pad2(a[1])+'/'+pad2(a[2])}
    v=String(v);
  }
  var t=toLatin(v).trim();
  if(/^\d{8}$/.test(t)) t=t.slice(0,4)+'/'+t.slice(4,6)+'/'+t.slice(6);
  var m=t.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(!m) return null;
  var y=+m[1], mo=+m[2], d=+m[3];
  if(y>=1700){if(mo<1||mo>12||d<1||d>31) return null;a=g2j(y,mo,d);return a[0]+'/'+pad2(a[1])+'/'+pad2(a[2])}
  return normDate(y+'/'+mo+'/'+d);
}
function buildImport(){
  var A=IMP.aoa, out={items:[],skip:[]}, T=IMP.type, keys=refKeys(), pre={expense:'f',receipt:'r',draw:'o',payment:'o'}[T];
  function c(r,k){var i=IMP.map[k];return (i===''||i==null)?'':r[+i]}

    var desc=txt(c(r,'desc')), ref=normRef(txt(c(r,'ref')));
    if(ref&&keys[pre+':'+ref]){out.skip.push('ردیف '+rowNo+': تکراری (پیگیری '+faDigits(ref)+')');continue}
    if(ref&&T!=='expense') keys[pre+':'+ref]=1;
    if(T==='payment'){
      var pa=numCell(c(r,'amount'));

    } else if(T==='expense'){

      out.items.push({col:'expenses',date:date,desc:desc||'—',cat:txt(c(r,'cat')),party:txt(c(r,'party')),total:total,paid:paid>0?paid:0,bank:txt(c(r,'bank')),ref:ref,show:[date,desc||'—',txt(c(r,'party')),total]});
    } else if(T==='receipt'){
      var am=numCell(c(r,'amount')), usd=numCell(c(r,'usd')), rate=numCell(c(r,'rate'));
      var cur='IRR', amount=am, rt=0, base=am;
      if(usd>0){cur='USD';amount=usd;rt=rate>0?rate:(am>0?am/usd:(+S.cfg.rate||0));base=am>0?am:usd*rt}
      if(!(base>0)||(cur==='USD'&&!(rt>0))){out.skip.push('ردیف '+rowNo+': مبلغ یا نرخ دلار نامعتبر');continue}
      out.items.push({col:'receipts',date:date,desc:desc,from:txt(c(r,'from')),cur:cur,amount:amount,rate:rt,base:base,via:txt(c(r,'via')),bank:txt(c(r,'bank')),ref:ref,show:[date,desc||'دریافت',txt(c(r,'from')),base]});
    } else {

}

/* a payment settles the party's oldest open expense rows first; any remainder becomes a paid expense row */
function payJobs(list,base){
  var work={}, made=[];
  list.slice().sort(cmpDate).forEach(function(p){
    var left=p.amount;
    var open=p.partyId?S.expenses.filter(function(e){return e.party===p.partyId}).map(function(e){return work[e.id]||e}).filter(function(e){return e.total-e.paid>0.5}).sort(cmpDate):[];
    for(var i=0;i<open.length&&left>0.5;i++){
      var e=open[i], a=Math.min(left,e.total-e.paid), v=work[e.id];
      if(!v){v=Object.assign({},e);v.pays=e.pays.slice();delete v.sample;work[e.id]=v}
      var pe={d:p.date,a:a,b:p.bankId||''}; if(p.ref) pe.r=p.ref;
      v.pays.push(pe);v.paid=sum(v.pays,function(q){return q.a});left-=a;
    }
    if(left>0.5){
      var pe2={d:p.date,a:left,b:p.bankId||''}; if(p.ref) pe2.r=p.ref;
      made.push({col:'expenses',id:store.newId(),doc:{no:base.expenses++,date:p.date,desc:p.desc||'پرداخت بدون فاکتور',cat:'',party:p.partyId||'',total:left,paid:left,pays:[pe2],ref:''}});
    }
  });
  return Object.keys(work).map(function(id){var v=Object.assign({},work[id]);delete v.id;return {col:'expenses',id:id,doc:v}}).concat(made);
}

  try{
    for(var i=0;i<items.length;i++){

    var base={expenses:nextNo(S.expenses),receipts:nextNo(S.receipts),draws:nextNo(S.draws)};

function preview(f){
  var p=$('#f-prev',f); if(!p) return;
  var t=f.dataset.form, g=function(n){return f.elements[n]?f.elements[n].value:''};
  if(t==='expense'){
    var oe=byId(S.expenses,f.dataset.id), rm=(f.dataset.rm||'').split(',').filter(Boolean).map(Number);
    var kept=oe?sum(oe.pays.filter(function(q,i){return rm.indexOf(i)<0}),function(q){return q.a}):0;
    var b=parseNum(g('total'))-kept-parseNum(g('paid'));p.innerHTML='مانده حساب: <span class="'+(b>0?'debt':b<0?'warn':'credit')+'">'+fmt(b)+' '+unit()+'</span>'+(b<0?' (پیش‌پرداخت)':'')}
  else if(t==='pay'){var e=byId(S.expenses,f.dataset.id);var left=(e.total-e.paid)-parseNum(g('amt'));p.innerHTML='مانده بعد از این پرداخت: <span class="'+(left>0?'debt':'credit')+'">'+fmt(left)+' '+unit()+'</span>'}
  else if(t==='receipt'){
    var usd=f.elements.cur.value==='USD';$('#rateBox',f).hidden=!usd;$('#viaBox',f).hidden=f.elements.route.value!=='exchange';
    p.innerHTML=usd?'معادل: <span class="credit">'+fmt(parseNum(g('amount'))*parseNum(g('rate')))+' '+unit()+'</span>':'ثبت به‌عنوان '+unit()+'';
  }
  else if(t==='party'){p.innerHTML='نمایش در دفتر: <b>'+esc(((g('trade')?g('trade')+' ':'')+g('name')).trim()||'—')+'</b>'}
  else if(t==='wage'){
    var fixed=f.elements.mode.value==='fixed';$('#wPct',f).hidden=fixed;$('#wFix',f).hidden=!fixed;
    var c=calc(), base=f.elements.base.value==='paid'?c.paid:c.cost;
    var due=fixed?parseNum(g('fixed')):base*parseNum(g('pct'))/100;
    p.innerHTML='استحقاق فعلی: <span class="accent">'+fmt(due)+' '+unit()+'</span> · برداشت‌شده '+fmt(c.wd)+' · مانده '+fmt(due-c.wd);
  }
}

async function ensure(col,name,role){
  name=(name||'').trim().replace(/\s+/g,' ');
  if(!name) return '';
  var key=name.toLowerCase(), hit=S[col].filter(function(x){return pname(x).toLowerCase()===key})[0];
  if(hit) return hit.id;
  var id=store.newId(), v={name:name}; if(role) v.role=role; if(col==='banks') v.opening=0;
  await store.put(col,id,v);
  if(!byId(S[col],id)) S[col]=S[col].concat([Object.assign({id:id},v)]);
  return id;
}

async function toDataUrlSmall(blob){

    var sc=Math.min(1,side/Math.max(bmp.width,bmp.height)),cv=D.createElement('canvas');
    cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);

    url=cv.toDataURL('image/jpeg',q);

  if(act==='imp-run'){runImport();return}
  if(act==='imp-reset'){IMP.wb=null;IMP.aoa=[];IMP.file='';IMP.msg='';render();return}
  if(act==='stmt'){UI.sheet={type:'stmt'};openSheet(stmtHtml(id));return}
  var open={
    'add-expense':['expense',null],'add-receipt':['receipt',null],'add-draw':['draw',null],'add-cat':['cat',null],'add-party':['party',null],'wage':['wage',null],
    'edit-expense':['expense',S.expenses],'edit-receipt':['receipt',S.receipts],'edit-draw':['draw',S.draws],'edit-cat':['cat',S.cats],'edit-party':['party',S.parties],'pay':['pay',S.expenses],'add-bank':['bank',null],'edit-bank':['bank',S.banks]
  }[act];
  if(open){
    var item=open[1]?byId(open[1],id):null;
    if(open[1]&&!item) return;
    UI.sheet={type:open[0],id:item?item.id:''};
    openSheet(FORMS[open[0]](item));
    return;
  }
  if(act==='del'){
    el.dataset.act='del-confirm';el.textContent='تأیید حذف';
    clearTimeout(delTimer);delTimer=setTimeout(function(){if(el.isConnected){el.dataset.act='del';el.textContent='حذف'}},4000);
    return;
  }
  if(act==='del-confirm'){
    var f=el.closest('form'), t=f.dataset.form, rid=f.dataset.id, d=DELS[t];
    var why=d[1](rid);
    if(why){showErr(f,why);el.dataset.act='del';el.textContent='حذف';return}
    el.disabled=true;
    var gone=attIds(byId(S[d[0]]||[],rid));
    try{await store.del(d[0],rid);closeSheet();toast('حذف شد');setTimeout(function(){dropAssets(gone)},800)}catch(e){showErr(f,'حذف نشد: '+(e&&e.message||e));el.disabled=false}
  }
});
D.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&!$('#lb').hidden){$('#lb').hidden=true;$('#lbPic').innerHTML='';return}
  if(ev.key==='Escape'&&!$('#sheet').hidden){closeSheet();return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.row,.setrow')){ev.preventDefault();ev.target.click()}
});
$('#scrim').addEventListener('click',closeSheet);
D.addEventListener('submit',async function(ev){
  var f=ev.target.closest('form[data-form]'); if(!f) return;
  ev.preventDefault();
  if(f.dataset.form==='proj'){
    var pn=f.elements.name.value.trim(); if(!pn){showErr(f,'نام پروژه را بنویسید.');return}
    var pb=$('[type=submit]',f); pb.disabled=true;
    try{await createProject(pn);toast('پروژهٔ «'+pn+'» ساخته شد')}catch(e){showErr(f,'ساخته نشد: '+(e&&e.message||e));pb.disabled=false}
    return;
  }
  var b=$('[type=submit]',f); b.disabled=true;
  var si=f.dataset.scan!=null?SCAN.items[+f.dataset.scan]:null;
  var af=f.elements.attfile&&f.elements.attfile.files&&f.elements.attfile.files[0];
  if(af){
    b.textContent='در حال پیوست عکس…';
    try{var aid=await uploadPicked(af);if(aid)setAtt(f,aid)}catch(e){toast('عکس پیوست نشد؛ ردیف بدون عکس ذخیره می‌شود')}
    b.textContent=f.dataset.form==='pay'?'ثبت پرداخت':'ذخیره';
  }
  if(si&&f.elements.att&&!f.elements.att.value){
    b.textContent='در حال پیوست عکس…';
    try{f.elements.att.value=await attachFor(si)}catch(e){toast('عکس پیوست نشد؛ ردیف بدون عکس ذخیره می‌شود')}
    b.textContent=f.dataset.form==='pay'?'ثبت پرداخت':'ذخیره';
  }
  try{ var ok=await SAVE[f.dataset.form](f); if(ok!==false){
    if(si){si.done=true;await learnCards(si,f);if(SCAN.items.some(function(x){return !x.done})){openScan();toast('ذخیره شد');return}}
    closeSheet();toast('ذخیره شد')} }
  catch(e){ showErr(f,'ذخیره نشد: '+(e&&e.message||e)) }
  finally{ b.disabled=false }
});
D.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&(t.dataset.rep==='from'||t.dataset.rep==='to')){REP[t.dataset.rep]=t.value;drawReport();return}
  if(t.id==='expQ'){UI.q=t.value;drawExpenseList();return}
  if(t.id==='scanNote'){SCAN.note=t.value;return}
  var f=t.closest&&t.closest('form[data-form]'); if(f) preview(f);
});
D.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='impFile'){if(t.files&&t.files[0]) loadFile(t.files[0]);return}
  if(t.id==='scanFile'){if(t.files&&t.files.length) scanFiles(t.files);return}
  if(t.dataset&&t.dataset.imp){impSet(t.dataset.imp,t.value);return}
  if(t.dataset&&t.dataset.repsec){REP.sec[t.dataset.repsec]=t.checked;drawReport();return}
  if(t.dataset&&t.dataset.map!==undefined){IMP.map[t.dataset.map]=t.value;drawImpPrev();return}
  var f=t.closest&&t.closest('form[data-form]'); if(f){preview(f);return}
  if(t.dataset&&t.dataset.cfg){
    var v=Object.assign({},S.cfg),k=t.dataset.cfg;
    v[k]=(k==='rate')?parseNum(t.value):t.value.trim();
    if(k==='project'&&!v[k]) v[k]='پروژه من';
    if(k==='project'&&(PROJ.list.length||PROJ.cur!=='main')){var po=byId(PROJ.list,PROJ.cur);BASE.put('projects',PROJ.cur,{name:v[k],order:po?po.order||0:(PROJ.cur==='main'?0:Date.now())}).catch(function(){})}
    store.put('settings','main',v).then(function(){toast('ذخیره شد')},function(e){toast('ذخیره نشد: '+(e&&e.message||e))});
  }
});
D.addEventListener('focusout',function(ev){
  var t=ev.target;
  if(t.matches&&t.matches('[data-money]')){var s=t.value.trim();t.value=s===''?'':fmt(parseNum(s))}
});

boot();
initScan();
})();
</script>
